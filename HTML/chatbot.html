<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatBot - Tehnologii Web</title>

    <link rel="stylesheet" href="../CSS/chatbot_style.css">
</head>

<body>

    <header class="site-header">

        <h1>Comunitatea de Tehnologii Web 2025</h1>

        <nav>
            <a href="home.html">Acasă</a>
            <a href="home.html#tehnologii">Tehnologii</a>
            <a href="home.html#facultati">Facultăți</a>
            <a href="chatbot.html" class="active">ChatBot</a>
            <a href="login.html">Logout</a>
        </nav>

    </header>


    <main class="chatbot-page">

        <section class="chatbot-container">

            <div class="chatbot-header">
                <h2>ChatBot</h2>
                <p>Asistentul comunității de Tehnologii Web</p>
            </div>


            <div class="chat-messages" id="chatMessages">

                <div class="message bot-message">
                    <p>
                        Bună! Sunt ChatBot. Cu ce te pot ajuta?
                    </p>
                </div>

            </div>


            <form class="chat-input-area" id="chatForm">

                <input
                    type="text"
                    id="userInput"
                    placeholder="Scrie un mesaj..."
                    autocomplete="off"
                    required
                >

                <button type="submit">
                    Trimite
                </button>

            </form>

        </section>

    </main>


    <footer class="site-footer">

        <p>© 2025 Comunitatea de Tehnologii Web</p>

        <p>
            Universitatea de Vest din Timișoara |
            Facultatea de Informatică
        </p>

    </footer>


    <script src="../JS/chatbot_js.js"></script>

</body>

</html>
